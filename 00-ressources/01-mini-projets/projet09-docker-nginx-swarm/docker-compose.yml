# MODE DEV (une seule machine) : docker compose up --build --scale web=3
services:
  web:
    build: ./app
    image: demo-web:1.0          # image reutilisee ensuite par Swarm
    expose:
      - "5000"                    # port interne (non publie) : seul Nginx y accede
    environment:
      # Prend la variable BG_COLOR du terminal si definie, sinon la valeur par defaut.
      BG_COLOR: "${BG_COLOR:-#0f172a}"   # couleur de fond de la page (changez-la !)
    restart: unless-stopped
    # PAS de container_name ici : sinon impossible de lancer plusieurs repliques.

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"                 # http://localhost:8088
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
