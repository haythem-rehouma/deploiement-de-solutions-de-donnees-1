# Nginx = reverse proxy + repartiteur de charge devant le service "web".
events {}

http {
    # DNS interne de Docker (toujours 127.0.0.11). Grace au "resolver" + a la
    # variable $backend, Nginx re-resout "web" a chaque requete : il decouvre
    # ainsi TOUTES les repliques et repartit la charge (round-robin).
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $backend http://web:5000;
            proxy_pass $backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
