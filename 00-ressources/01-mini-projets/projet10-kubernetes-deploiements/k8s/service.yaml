# Service = une adresse stable + repartition de charge devant les Pods.
# Type NodePort : expose l'appli sur un port de la machine (30080) pour y acceder
# depuis le navigateur : http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  labels:
    app: demo-web
spec:
  type: NodePort
  selector:
    app: demo-web          # envoie le trafic vers TOUS les Pods portant ce label
  ports:
    - port: 80             # port du Service (interne au cluster)
      targetPort: 5000     # port du conteneur (Flask)
      nodePort: 30080      # port ouvert sur la machine (plage autorisee : 30000-32767)
