# NodePort = ouvre un PORT sur la machine (le noeud) pour un acces EXTERNE.
# Acces : http://localhost:30082  (plage autorisee : 30000-32767)
apiVersion: v1
kind: Service
metadata:
  name: demo-nodeport
  labels:
    app: demo-back
spec:
  type: NodePort
  selector:
    app: demo-back
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082        # port fixe ouvert sur l'hote
