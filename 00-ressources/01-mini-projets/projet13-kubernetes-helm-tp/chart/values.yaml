# values.yaml — valeurs par defaut du chart hedge.
# Chaque environnement (dev / staging / prod) fournit un fichier values-<env>.yaml
# qui SURCHARGE ces valeurs par-dessus. Ne modifiez PAS ce fichier par
# environnement : c'est le fichier "generique", il doit rester neutre.

environment: default
banniere:
  message: "Chart Helm — application multi-environnement"
  couleur: "#64748b"

portail:
  image:
    repository: hedge-portail
    tag: "1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: NodePort
    port: 80
    targetPort: 5000
    nodePort: 30130

api:
  image:
    repository: hedge-api
    tag: "1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
